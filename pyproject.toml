[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow",
    "pydantic>=2",
    "pyspark",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["grocery"]