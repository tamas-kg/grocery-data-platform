[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-data-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyarrow",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

local = [
    "pyspark",
]

databricks = [
    "databricks-connect>=19,<20",
]

[tool.uv]
default-groups = ["dev", "local"]
conflicts = [
    [
        { group = "local" },
        { group = "databricks" },
    ],
]

[tool.uv.dependency-groups]
databricks = { requires-python = ">=3.12" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["grocery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]